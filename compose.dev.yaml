# Builds from this checkout instead of pulling, with the status page on.
# Runs as pve-answer-dev on 444, so it can sit alongside the published one.
#
#   docker compose -f compose.dev.yaml up -d --build
services:
  pve-answer:
    build: .
    container_name: pve-answer-dev
    restart: unless-stopped
    ports:
      - "444:8443"
    environment:
      - PVE_ANSWER_HOSTNAMES=${PVE_ANSWER_HOSTNAMES:-}
      - PVE_ANSWER_TOKEN_FILE=/app/private/token
      - PVE_ANSWER_DEBUG=1
    volumes:
      - ./public:/app/public
      - ./private:/app/private
