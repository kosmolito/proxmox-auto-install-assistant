services:
  pve-answer:
    # Published by CI. Use :sha-<short> to pin a build.
    image: ghcr.io/kosmolito/proxmox-auto-install-assistant:latest
    container_name: pve-answer
    restart: unless-stopped
    ports:
      - "443:8443"
    environment:
      # Addresses the installer will use; needed the first time, for the cert.
      - PVE_ANSWER_HOSTNAMES=${PVE_ANSWER_HOSTNAMES:-}
      - PVE_ANSWER_TOKEN_FILE=/app/private/token
      # Status page at GET /. Lists which MACs have answer files.
      # - PVE_ANSWER_DEBUG=1
    volumes:
      # Writable: the entrypoint creates what is missing on first run.
      - ./public:/app/public
      - ./private:/app/private
